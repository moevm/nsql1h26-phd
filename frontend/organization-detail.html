<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Организация - Диссертационная система</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/organization-detail.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">Анализ диссертаций</div>
      <nav class="nav">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="dissertation.html" class="nav-link">Диссертации</a>
        <a href="authors.html" class="nav-link">Авторы</a>
        <a href="organizations.html" class="nav-link active">Организации</a>
      </nav>
      <div class="user-area"></div>
    </div>
  </header>

  <main style="padding: 32px;">
    <div style="max-width: 1280px; margin: 0 auto;">
      <div class="org-card">
        <div class="org-content">
          <h1 class="org-name">Загрузка...</h1>
          <div class="org-meta">
            <span class="org-short-name"></span>
            <span class="org-sep"></span>
            <span class="org-location"></span>
          </div>
          <div class="org-buttons">
            <button class="btn-outline-primary" onclick="window.location.href='dissertation.html?organization=' + encodeURIComponent(document.querySelector('.org-name').textContent)">🔍 Поиск диссертаций</button>
          </div>
          <div class="stats-group">
            <div class="stat-square purple">
              <div class="stat-square-number">0</div>
              <div class="stat-square-label">Диссертаций</div>
            </div>
          </div>
        </div>
      </div>

      <div class="org-dashboard">
        <div class="org-table-section">
          <div class="org-tabs">
            <div class="org-tabs-header">
              <div class="org-tab active">Диссертации</div>
            </div>
            <div class="search-panel">
              <div class="search-row">
                <input type="text" class="search-input" placeholder="Поиск по названию...">
                <select class="search-select">
                  <option>Все годы</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option>
                </select>
                <select class="search-select">
                  <option>Все специальности</option>
                </select>
              </div>
            </div>
            <div class="org-table-wrapper">
              <table class="org-table">
                <thead><tr><th>Название</th><th>Автор</th><th>Год</th><th>Специальность</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="org-pagination">
              <div class="pagination-info"></div>
              <div class="pagination-controls"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
