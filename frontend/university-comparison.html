      <a href="dissertation.html" class="sidebar-item">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM13 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2zM13 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2z"/></svg>

        Аналитика

  <main class="main-content">
    <h1 class="page-title">Сравнение вузов</h1>
    <div class="page-subtitle">Топ организаций по количеству защит диссертаций</div>

    <div class="filters-card" style="margin-bottom: 32px;">
      <div class="filters-grid" style="grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: end;">
        <div class="filter-field">
          <label class="filter-label">Год от</label>
          <input type="number" id="year-from" class="filter-input" placeholder="2015" min="2000" max="2030">
        </div>
        <div class="filter-field">
          <label class="filter-label">Год до</label>
          <input type="number" id="year-to" class="filter-input" placeholder="2026" min="2000" max="2030">
        </div>
        <div class="filter-field" style="display: flex; align-items: flex-end;">
          <button id="show-all-btn" class="btn-primary" style="margin-right: 8px;">Всё время</button>
          <button id="apply-period-btn" class="btn-secondary">Применить период</button>
        </div>
      </div>
    </div>

    <div class="dashboard-grid" style="grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 32px;">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Распределение по организациям</span>
        </div>
        <div style="padding: 20px; max-height: 400px;">
          <canvas id="org-pie-chart"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Топ-10</span>
        </div>
        <div class="results-table" style="max-height: 400px; overflow-y: auto;">
          <table>
            <thead>
              <tr><th>№</th><th>Организация</th><th>Количество диссертаций</th></tr>
            </thead>
            <tbody id="top10-table-body">
            </tbody>
          </table>
        </div>
      </div>
    </div>
